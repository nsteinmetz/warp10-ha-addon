configuration:
  heap:
    name: JVM heap size
    description: >-
      Initial and maximum JVM heap size (e.g. "1g", "512m").
      Increase this if you ingest a lot of sensors or keep long history.
  disable_sensision:
    name: Disable Sensision
    description: >-
      Sensision collects internal Warp10 usage metrics (number of GTS,
      function calls, etc.) and stores them in your Warp10 instance.
      Set to true to disable it.
  enable_warpstudio:
    name: Enable WarpStudio
    description: >-
      Enable the WarpStudio web UI (port 8081). Only takes effect on the
      add-on's very first start with a fresh data directory — changing it
      afterward has no effect, since this is decided once during Warp10's
      own first-run initialization.
  write_token:
    name: Write token
    description: >-
      Fixed write token to use with warp10-ha-integration and any other
      writer. Leave empty to have the add-on generate one on first start
      (check the add-on log for the generated value) — it stays stable
      across restarts either way.
  read_token:
    name: Read token
    description: >-
      Fixed read token, e.g. for WarpStudio or Grafana. Leave empty to have
      the add-on generate one on first start (check the add-on log for the
      generated value) — it stays stable across restarts either way.
