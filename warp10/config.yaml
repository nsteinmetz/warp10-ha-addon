name: "Warp 10"
# Must exactly match the GitHub Release tag name that publishes the image
# Supervisor will pull (see .github/workflows/build.yml) — not the pinned
# WARP10_VERSION build-arg.
version: "3.5.0-1"
slug: "warp10"
description: "Warp 10 time series platform, running locally as a Home Assistant add-on"
url: "https://github.com/nsteinmetz/warp10-ha-addon"
# Match this list to what the pinned warp10io/warp10 tag actually publishes
# on Docker Hub before enabling an architecture here.
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
ports:
  8080/tcp: 8080
  8081/tcp: 8081
ports_description:
  8080/tcp: "Warp 10 HTTP API (ingestion & WarpScript execution)"
  8081/tcp: "WarpStudio web UI"
options:
  heap: "1g"
  disable_sensision: false
  enable_warpstudio: true
  write_token: ""
  read_token: ""
schema:
  heap: str
  disable_sensision: bool
  enable_warpstudio: bool
  write_token: str?
  read_token: str?
image: "ghcr.io/nsteinmetz/warp10-ha-addon"
