name: Build

# Publish a GitHub Release to trigger a build. The image gets pushed with
# the release's own tag name (github.event.release.tag_name) — Supervisor
# pulls "image:<config.yaml version>" verbatim, so the release's tag name
# and warp10/config.yaml's "version" field MUST be the exact same string
# (e.g. tag "3.5.0-1" <-> version: "3.5.0-1"), or Supervisor's pull 404s/403s
# even though the build succeeded.
# You can also run this manually while developing (workflow_dispatch), but
# that skips the image-tags/version steps that come from the release event.
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: warp10-ha-addon
  # Pin the upstream Warp10 release baked into the image (must be a tag that
  # actually exists at https://hub.docker.com/r/warp10io/warp10/tags — it's
  # never published a bare "<version>" tag, always "<version>-ubuntu" or
  # "<version>-alpine"). Bump this and Dockerfile's matching ARG default
  # together when you want to update Warp10.
  WARP10_VERSION: "3.5.0-ubuntu"

permissions:
  contents: read

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # to check out the code
      id-token: write # for Cosign signing (OIDC token)
      packages: write # to push built images to GHCR
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: ./warp10
          build-args: |
            WARP10_VERSION=${{ env.WARP10_VERSION }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ github.event.release.tag_name }}
            latest
          push: "true"
          version: ${{ github.event.release.tag_name }}

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for Cosign signing (OIDC token)
      packages: write # to push the manifest to GHCR
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ github.event.release.tag_name }}
            latest
